    "pandas>=3.0.0",
    "plotly>=6.5.2",
    "kaleido>=1.2.0",
    "datashader>=0.18.2",
    "holoviews>=1.22.1",
    "bokeh>=3.8.2",
    "colorcet>=3.1.0",
    "pillow>=12.1.0",
    "dash>=4.0.0",
    "langevitour>=0.8.0",
    "setuptools>=67.8.0,<69.0.0",
    "jupyter>=1.1.1",
    "ipykernel>=7.2.0",
